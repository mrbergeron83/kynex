<title>Kynex · before / after</title>
<style>
  /* The bundled fonts, when this page is opened from the repo; system fallbacks otherwise. */

  .seg { display: inline-flex; border: 1px solid #33312e; border-radius: 6px; overflow: hidden; }

  /* ---------- the window ---------- */
  .app { width: 1280px; height: 800px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--editor); color: var(--text); font-size: 14px; line-height: 1.45; border: 1px solid var(--border); border-radius: 8px; }

  .app[data-theme=light] { --title:#e8e6e3; --panel:#f0edea; --editor:#f9f7f5; --elevated:#fefcfa; --border:#d4d2cf; --border2:#e2dfdc; --text:#292622; --muted:#5d5a56; --ph:#888682; --accent:#07657d; --on-accent:#ffffff; --hover:#e8e6e3; --active:#dedcd9; --element:#f0edea; --selection:#d7ecf4; --ok:#348f4f; --warn:#d78c00; --err:#c8443a; --add:#d9f3dd; --del:#ffe3de; --pc:#a52727; --title-tint:#d9bcba; --kw:#a4542a; --str:#3f7f2f; --ty:#07657d; --num:#8a6a12; --cm:#888682; --fn:#292622; --shadow: 0 8px 24px rgba(40,30,20,.18); }
  .mono { font-family: "JetBrains Mono", Consolas, monospace; }
  .xs { font-size: 12px; }
  .muted { color: var(--muted); }
  .ph { color: var(--ph); }
  .ic { flex: none; }
  .label { font: 600 10.5px "Hubot Sans Expanded", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .ibtn { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--muted); flex: none; }
  .ibtn.on { background: var(--active); color: var(--text); }
  .ghost { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
  .lamp { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .lamp.idle { border: 1px solid var(--ph); }

  .lamp.needs { background: var(--warn); }
  .lamp.done { background: var(--ok); }

  /* title bar */
  .titlebar { height: 36px; flex: none; display: flex; align-items: center; padding-left: 10px; background: var(--title-tint); border-bottom: 2px solid var(--pc); }
  .brand { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px 0 4px; margin-right: 8px; border-radius: 6px; }
  .wordmark { font: 800 10.5px "Hubot Sans Expanded", sans-serif; letter-spacing: .12em; color: var(--muted); }
  .tabs { display: flex; align-items: center; gap: 2px; }
  .tab { display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 6px; color: var(--muted); white-space: nowrap; }
  .tab.on { background: var(--active); color: var(--text); }
  .drag { flex: 1; height: 100%; }
  .usage { display: flex; align-items: center; gap: 12px; margin-right: 8px; padding: 0 6px; font-size: 12px; }
  .usage .m { display: flex; align-items: center; gap: 6px; }
  .usage .track { width: 28px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .usage .track i { display: block; height: 100%; background: var(--accent); }
  .winctl { display: flex; height: 100%; }
  .winctl div { width: 46px; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--muted); }

  /* body */
  .body { flex: 1; min-height: 0; display: flex; }
  .sessions { width: 260px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--border); position: relative; }
  .sessions .head { height: 36px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 12px; }
  .sessions .head .label { flex: 1; }
  .slist { flex: 1; min-height: 0; overflow: hidden; padding: 0 6px 4px; position: relative; }
  .srow { display: flex; align-items: center; gap: 4px; height: 30px; padding: 0 4px 0 8px; border-radius: 6px; color: var(--muted); }
  .srow .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow.cur { color: var(--text); background: var(--active); }
  .after .srow.cur { background: var(--selection); }
  .after .srow { height: 28px; }
  .group { padding: 12px 8px 4px; }
  .group:first-child { padding-top: 6px; }
  .sfoot { flex: none; border-top: 1px solid var(--border2); padding: 6px; }
  .sfoot .ghost { width: 100%; }

  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--editor); }
  .toolbar { height: 36px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--border2); }
  .segbtn { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; color: var(--muted); }
  .segbtn.on { background: var(--active); color: var(--text); }
  .toolbar .path { flex: 1; min-width: 0; padding: 0 8px; font-size: 12px; color: var(--ph); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header { height: 32px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border2); }

  .chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--border2); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip.plain { border-color: transparent; }
  .meter { width: 36px; height: 4px; border-radius: 2px; background: var(--border2); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--ph); }
  .mcp { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

  /* transcript */
  /* The list follows its tail, so the window shows the end of the conversation and cuts the top. */
  .thread { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 8px 24px 0; }
  .col { width: 100%; max-width: 780px; display: flex; flex-direction: column; flex: none; }
  .after .col { max-width: 820px; }
  .row { padding: 8px 0; }

  .user { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border2); background: var(--element); }
  .after .user { border-color: transparent; }
  .thinking { font-style: italic; color: var(--ph); }
  .thought { display: flex; align-items: center; gap: 6px; height: 22px; font-size: 12px; color: var(--ph); }
  .p { margin: 0; }
  code.inl { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12.5px; background: var(--element); padding: 0 3px; border-radius: 3px; }
  .after code.inl { background: var(--element); }
  .trow { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 4px; border-radius: 6px; }
  .trow .sum { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .name { font-size: 12px; font-weight: 500; color: var(--muted); }
  .trow .cmd { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; color: var(--muted); }
  .nest { padding-left: 16px; display: flex; flex-direction: column; }
  .stat { display: inline-flex; gap: 4px; font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; }
  .add { color: var(--ok); } .del { color: var(--err); }
  .box { margin: 4px 0 0 24px; border-radius: 6px; border: 1px solid var(--border2); background: var(--panel); overflow: hidden; }
  .before .box { padding: 8px; }
  .diff { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; line-height: 1.5; }
  .diff .l { display: flex; white-space: pre; }
  .diff .l.a { background: var(--add); } .diff .l.d { background: var(--del); }
  .diff .n { width: 34px; flex: none; text-align: right; padding-right: 10px; color: var(--ph); user-select: none; }
  .diff .s { width: 14px; flex: none; color: var(--muted); }
  .diff .c { flex: 1; min-width: 0; }
  .diff .hunk { color: var(--ph); padding: 2px 0 2px 48px; }
  .codeblock { position: relative; border-radius: 6px; border: 1px solid var(--border2); background: var(--element); }
  .codeblock pre { margin: 0; padding: 8px 12px; font-family: "JetBrains Mono", Consolas, monospace; font-size: 13px; line-height: 1.5; overflow: hidden; }
  .codeblock .tools { position: absolute; top: 4px; right: 4px; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ph); }
  .after .codeblock .lang { position: absolute; top: 6px; right: 12px; font-size: 11px; color: var(--ph); }
  .k { color: var(--kw); } .s { color: var(--str); } .ty { color: var(--ty); } .nu { color: var(--num); } .cm { color: var(--cm); font-style: italic; } .fn { color: var(--fn); }
  .result { display: flex; align-items: center; gap: 6px; padding: 4px 4px 0; font-size: 12px; color: var(--muted); }
  .turnend { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ph); padding: 6px 0 2px; }
  .turnend hr { flex: 1; border: 0; border-top: 1px solid var(--border2); margin: 0; }
  .turnend .files { display: flex; gap: 4px; }
  .turnend .f { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; padding: 0 6px; height: 18px; display: inline-flex; align-items: center; border-radius: 4px; background: var(--element); color: var(--muted); }
  .scrollbar { position: absolute; top: 6px; bottom: 6px; right: 3px; width: 4px; }
  .scrollbar i { position: absolute; left: 0; right: 0; border-radius: 2px; background: var(--ph); opacity: .55; }

  /* composer */
  .compose { flex: none; display: flex; flex-direction: column; align-items: center; padding: 4px 24px 16px; }
  .compose .col { gap: 6px; }
  .workbar { display: flex; flex-direction: column; gap: 4px; padding: 0 4px; }
  .workbar .lbl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent); }
  .workbar .track { position: relative; height: 2px; border-radius: 1px; background: var(--border2); overflow: hidden; }
  .workbar .track i { position: absolute; top: 0; height: 100%; width: 30%; border-radius: 1px; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { left: -30% } to { left: 100% } }
  .cbox { position: relative; padding: 12px; border-radius: 8px; border: 1px solid var(--pc); background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.2); display: flex; flex-direction: column; gap: 8px; }
  .cbox .text { min-height: 22px; color: var(--ph); }
  .cbox .text b { color: var(--text); font-weight: 400; }
  .cbox .text .caret { display: inline-block; width: 1px; height: 16px; background: var(--text); vertical-align: -3px; margin-left: 1px; }
  .cbox .bar { display: flex; align-items: center; gap: 4px; }
  .cbox .bar .sp { flex: 1; }
  .stopbtn { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); }
  .sendbtn { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; }
  .popup { position: absolute; left: 0; right: 0; bottom: 100%; padding-bottom: 4px; }
  .pop { border-radius: 8px; border: 1px solid var(--border); background: var(--elevated); box-shadow: var(--shadow); padding: 4px; }
  .crow { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px; border-radius: 6px; font-size: 13px; }
  .crow.sel { background: var(--active); }
  .crow .d { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); font-size: 12px; }

  /* dock */
  .dock { flex: none; position: relative; border-top: 1px solid var(--border); display: flex; flex-direction: column; background: var(--editor); }
  .dock .tabsbar { height: 32px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--border2); }
  .dock .ttab { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; background: var(--active); font-size: 13px; }

  .dock .exited { position: absolute; right: 10px; bottom: 8px; font: 12px "IBM Plex Sans", sans-serif; color: var(--muted); background: var(--elevated); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
  .dock.strip { height: 28px; flex-direction: row; align-items: center; gap: 8px; padding: 0 10px; font-size: 12px; color: var(--muted); }
  .dock.strip .mono { color: var(--text); }

  .toast { position: absolute; display: flex; align-items: flex-start; gap: 8px; width: 360px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--elevated); box-shadow: var(--shadow); font-size: 13px; }
  .toast .m2 { font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px; color: var(--muted); }
  .before .toast { top: 44px; right: 12px; }
  /* After: one line, bottom-right, above the composer's row of controls; it never covers Stop or the header. */
  .after .toast { right: 16px; bottom: 112px; width: auto; max-width: 460px; align-items: center; padding: 4px 6px 4px 10px; border-radius: 999px; font-size: 12px; }
  .after .toast .m1 { white-space: nowrap; }
  .after .toast .m2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
  .after .toast .ibtn { width: 20px; height: 20px; }
  .palette { position: absolute; inset: 0; background: rgba(0,0,0,.25); display: flex; justify-content: center; padding-top: 120px; }
  .palette .pop { width: 560px; align-self: flex-start; padding: 6px; }
  .palette .q { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-bottom: 1px solid var(--border2); margin-bottom: 4px; color: var(--text); }
  .palette .q .caret { display: inline-block; width: 1px; height: 16px; background: var(--text); }
  .palette .grp { padding: 8px 10px 2px; }
  .palette .crow { height: 28px; }
  .palette .crow .k { margin-left: auto; font: 11px "JetBrains Mono", monospace; color: var(--ph); }

  /* notes: a badge pinned to the element it talks about, in the margin beside it */
  [data-note]:not(.toast):not(.scrollbar) { position: relative; }
  .note { position: absolute; left: -28px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #f2af48; color: #0f0e0c; font: 600 11px "IBM Plex Sans", sans-serif; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px rgba(0,0,0,.4); z-index: 5; line-height: 1; }
  .usage .note { left: -26px; top: 3px; }
  .sessions .head .note { left: 88px; top: 9px; }
  .header .note { left: auto; right: 418px; top: 7px; }
  .user .note { top: 9px; }
  .codeblock .note { top: 9px; }
  .cbox .note { top: 13px; }
  .dock.strip .note { left: auto; right: 64px; top: 5px; }
  .toast .note { left: -26px; top: 5px; }
  .scrollbar .note { left: -26px; top: 42%; }
  .toolbar .ibtn .note { left: -16px; top: 3px; }
  .legend { width: 1280px; columns: 2; column-gap: 28px; font-size: 13px; color: #a7a4a0; margin: 0; padding: 0 0 0 24px; }
  .legend li { break-inside: avoid; margin-bottom: 6px; }
  .legend li::marker { color: #f2af48; font-weight: 600; }
</style>
</head>
<body>
<div class="controls">
  <span class="title">KYNEX</span>
  <span>before / after</span>
  <span class="seg" id="mode">
    <button data-v="side" class="on">Side by side</button>

    <button data-v="after">After</button>

  <span class="seg" id="theme">

  <label class="chk"><input type="checkbox" id="notes" checked> Numbered notes</label>
  <label class="chk"><input type="checkbox" id="atfile"> @file completion</label>
  <label class="chk"><input type="checkbox" id="palette"> Ctrl+K palette</label>
  <span class="hint">1280 × 800 each · the "before" is drawn from the 0.0.6 source and a screenshot; the "after" is the proposal</span>
</div>
<div id="stage"></div>

// ---------- a tiny Rust highlighter, enough for a mockup ----------
const KW = new Set('pub struct impl fn let self Self use mut return match if else for in const where as true false mod crate super ref move dyn'.split(' '));
function hl(src) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  return src.split('\n').map(line => {
    const c = line.indexOf('//');
    let code = line, comment = '';
    if (c >= 0) { code = line.slice(0, c); comment = line.slice(c); }
    let out = code.replace(/("(?:[^"\\]|\\.)*")|(\b\d+(?:\.\d+)?\b)|(\b[A-Z][A-Za-z0-9_]*\b)|(\b[a-z_][a-z0-9_]*\b)(?=\s*[!(])|(\b[a-z_][a-z0-9_]*\b)/g,
      (m, str, num, ty, call, id) => {
        if (str) return `<span class="s">${esc(str)}</span>`;
        if (num) return `<span class="nu">${num}</span>`;
        if (ty) return `<span class="ty">${ty}</span>`;
        if (call) return KW.has(call) ? `<span class="k">${call}</span>` : `<span class="fn">${call}</span>`;
        if (id) return KW.has(id) ? `<span class="k">${id}</span>` : esc(id);
        return esc(m);
      });
    return out + (comment ? `<span class="cm">${esc(comment)}</span>` : '');
  }).join('\n');
}
const plain = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');

function diff(lines, highlight) {
  return `<div class="diff">${lines.map(l => {
    if (l[0] === 'h') return `<div class="hunk">${plain(l[1])}</div>`;
    const cls = l[0] === 'a' ? 'a' : l[0] === 'd' ? 'd' : '';
    const sign = l[0] === 'a' ? '+' : l[0] === 'd' ? '−' : ' ';

    return `<div class="l ${cls}">${highlight ? `<span class="n">${l[1]}</span>` : ''}<span class="s">${sign}</span><span class="c">${body}</span></div>`;

  const html = `<div class="app ${v}" data-theme="${theme}">
    ${titleBar(v, theme)}
    <div class="body">${sessionsPanel(v)}<div class="main">${toolbar(v)}${header(v)}${transcript(v)}${composer(v, opts)}${dock(v)}</div></div>
    ${toast(v)}
    ${v === 'after' && opts.palette ? paletteOverlay() : ''}
  </div>`;
  // Each note's badge sits in the element it's about.
  return v === 'after' && opts.notes
    ? html.replace(/<(\w+) class="([^"]*)" data-note="(\d+)"([^>]*)>/g, (m, tag, cls, n, rest) => `<${tag} class="${cls}" data-note="${n}"${rest}><span class="note">${n}</span>`)
    : html;
}

const state = { mode: 'side', theme: 'dark', notes: true, atfile: false, palette: false };
function render() {
  const stage = document.getElementById('stage');
  const frames = state.mode === 'side' ? ['before', 'after'] : [state.mode];
  stage.innerHTML = frames.map(v => `<div class="frame"><h2>${v} <span>${v === 'before' ? 'Kynex 0.0.6 as it draws today' : 'the proposal, same session'}</span></h2>${app(v, state.theme, state)}${v === 'after' && state.notes ? `<ol class="legend">${NOTES.map(([n, t]) => `<li value="${n}">${t}</li>`).join('')}</ol>` : ''}</div>`).join('');
  // Fit two windows side by side on narrower screens.
  const need = frames.length * 1280 + (frames.length - 1) * 28 + 56;
  stage.style.zoom = Math.min(1, window.innerWidth / need);
}
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { state.mode = b.dataset.v; document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); render(); });
document.querySelectorAll('#theme button').forEach(b => b.onclick = () => { state.theme = b.dataset.t; document.querySelectorAll('#theme button').forEach(x => x.classList.toggle('on', x === b)); render(); });
for (const k of ['notes', 'atfile', 'palette']) document.getElementById(k).onchange = e => { state[k] = e.target.checked; render(); };
window.addEventListener('resize', render);
render();
</script>
</body>
</html>
