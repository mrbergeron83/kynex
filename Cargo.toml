[workspace]
members = ["crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
alacritty_terminal = "0.26"
async-channel = "2"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
gpui = { package = "gpui-pre", version = "=0.3.10" }
# gpui-pre 0.3.10 only gives macOS a text system (and therefore any text at
# all) when its `font-kit` feature is on; without it `MacPlatform` installs
# `NoopTextSystem`, so every glyph is dropped. Forward it from the platform
# crate, which owns `MacPlatform`.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit"] }
image = "0.25.10"
# Watching a session's scratch folder for the file explorer (ReadDirectoryChangesW, inotify, FSEvents).
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
kynex-core = { path = "crates/kynex-core" }
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
# Kynex's own CPU and memory, for the status footer: processes only.
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
unicode-segmentation = "1"

[workspace.lints.clippy]
# Render helpers take a lot of small values; a struct per call site reads worse.
too_many_arguments = "allow"

# The app: everything gpui. Logic without UI lives in crates/kynex-core.
[package]
name = "kynex"
version = "0.0.9"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false

[dependencies]
async-channel.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
# The same as gpui's: screenshots are decoded to thumbnails as `RenderImage` frames.
image.workspace = true
kynex-core.workspace = true
# The same as gpui's: the window's HWND, for the taskbar's "needs you" dot.
raw-window-handle = "0.6"
serde.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.23"

[lints]
workspace = true

[features]
# Hot-patch Rust code while the app runs: `dx serve --hot-patch --features hotpatch`.
# gpui re-renders every view through subsecond, so edits to `render` paths apply live.
# dx patches workspace crates (crates/kynex-core) as well as this one.
hotpatch = ["gpui/hot-reload"]

# Optimize dependencies even in dev builds: gpui, text shaping and image decoding
# are much snappier, while our own crates still compile (and hot-patch) fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
