[package]
name = "kynex"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
base64 = "0.23.1"
dioxus-devtools = { version = "0.7.10", optional = true }
eframe = { version = "0.37.0", features = ["persistence"] }
egui_commonmark = "0.26.0"
egui_extras = { version = "0.37.0", features = ["image"] }
image = "0.25.10"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subsecond = { version = "0.7.10", optional = true }

[features]
# Hot-patch Rust code while the app runs: `dx serve --hot-patch --features hotpatch`
hotpatch = ["dep:subsecond", "dep:dioxus-devtools"]

# Optimize dependencies even in dev builds: egui, image decoding and wgpu are
# much snappier, while our own crate still compiles (and hot-patches) fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
