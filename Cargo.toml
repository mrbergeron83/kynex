[package]
name = "kynex"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2"
base64 = "0.23.1"
dirs = "7.0.0"
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10" }
image = "0.25.10"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1"

[features]
# Hot-patch Rust code while the app runs: `dx serve --hot-patch --features hotpatch`.
# gpui re-renders every view through subsecond, so edits to `render` paths apply live.
hotpatch = ["gpui/hot-reload"]

# Optimize dependencies even in dev builds: gpui, text shaping and image decoding
# are much snappier, while our own crate still compiles (and hot-patches) fast.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
