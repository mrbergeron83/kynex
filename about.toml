# cargo-about: collects the license of every crate linked into Kynex, so the release
# archives can ship them (THIRD-PARTY-LICENSES.txt, rendered from about.hbs).
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
# A dependency under a license not listed here fails the release; check it's
# compatible with distributing Kynex under PolyForm Strict before adding it.
accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Our own crates (publish = false) are not third-party.
private = { ignore = true }
