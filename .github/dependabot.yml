# Weekly dependency updates, grouped so each ecosystem is one PR. Security
# updates (from Dependabot alerts) come as their own PRs whenever needed.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      cargo:
        patterns: ["*"]
        # gpui is pinned exactly (=0.3.x) and updated by hand.
        exclude-patterns: ["gpui-pre*"]
    ignore:
      - dependency-name: "gpui-pre*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
