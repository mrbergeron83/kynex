# Build Kynex for every desktop OS and publish a GitHub Release.
#
# Push a tag matching the version in Cargo.toml to release:
#   git tag v0.1.0 && git push origin v0.1.0
# Running it by hand (workflow_dispatch) only builds, so the archives can be
# checked from the run's artifacts without publishing anything.
#
# Nothing is built for release until the gates pass: the tag is on main and
# matches Cargo.toml, CI (fmt, clippy, tests on every OS) passes on the tagged
# commit, and cargo-deny finds no advisories as of now, not as of the merge.
#
# Once it's set up, kynex.exe is Authenticode-signed before the checksums are taken
# (the sign-windows job; CONTRIBUTING.md has the setup).
#
# Assets are plain archives named kynex-<target>.<zip|tar.gz> plus SHA256SUMS;
# keep those names stable, an installer or updater will look them up. Each
# archive gets a signed build provenance attestation, also published as
# kynex.intoto.jsonl; check one with
#   gh attestation verify kynex-x86_64-pc-windows-msvc.zip --repo mrbergeron83/kynex
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
      # Only reviewed, merged code is released: main takes changes through pull requests.
      - name: Tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't on main; release from a merged commit"
            exit 1
          fi
      # Release tags should be signed (shown as Verified on GitHub); a warning for now.
      - name: Tag is signed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')
          verified=false
          if [ -n "$tag" ]; then
            verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .verification.verified)
          fi
          if [ "$verified" != true ]; then
            echo "::warning::$GITHUB_REF_NAME isn't a signed tag; see Releasing in CONTRIBUTING.md"
          fi

  checks:
    # `$/` is this repository at the commit being released, with no checkout involved.
    uses: $/.github/workflows/ci.yml

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  build:
    needs: [verify, checks, cargo-deny]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # The oldest supported Ubuntu runner, so the binary runs on older glibc too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No cache for release builds: a poisoned cache must not end up in a published binary.
      - name: Linux libraries for gpui
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about
      # Fails if a dependency's license isn't accepted in packaging/about.toml.
      - name: Third-party licenses
        run: cargo about generate -c packaging/about.toml packaging/about.hbs -o THIRD-PARTY-LICENSES.txt
      - name: Package
        run: |
          mkdir dist pkg
          dir=target/${{ matrix.target }}/release
          name=kynex-${{ matrix.target }}
          cp LICENSE NOTICE.md THIRD-PARTY-LICENSES.txt pkg/
          mkdir pkg/fonts
          cp assets/fonts/*-LICENSE.txt pkg/fonts/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$dir/kynex.exe" pkg/
            (cd pkg && 7z a "../dist/$name.zip" .)
          else
            cp "$dir/kynex" pkg/
            tar -czf "dist/$name.tar.gz" -C pkg .
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kynex-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Authenticode-signs kynex.exe with Azure Artifact Signing, so SmartScreen knows
  # the publisher. Off until the repository variable SIGN_WINDOWS is "true"; the
  # credentials live in the protected `release` environment (see CONTRIBUTING.md).
  sign-windows:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.SIGN_WINDOWS == 'true'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Azure sign-in with OIDC, no stored password
    env:
      NAME: kynex-x86_64-pc-windows-msvc
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kynex-x86_64-pc-windows-msvc
          path: dist
      - name: Unpack
        shell: pwsh
        run: Expand-Archive "dist/$env:NAME.zip" -DestinationPath pkg
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\pkg\kynex.exe
          # Signs as the Azure CLI login above; the other credential types stay out of it.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
      - name: Check the signature and repack
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature pkg/kynex.exe
          if ($sig.Status -ne 'Valid') { throw "kynex.exe isn't validly signed: $($sig.Status) $($sig.StatusMessage)" }
          Remove-Item "dist/$env:NAME.zip"
          Compress-Archive -Path pkg/* -DestinationPath "dist/$env:NAME.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kynex-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error
          overwrite: true

  release:
    needs: [build, sign-windows]
    # Signing is skipped while it's off; a failed signing publishes nothing.
    if: ${{ !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-checksums: dist/SHA256SUMS
      # The signed provenance also ships as a release asset, so it can be checked
      # offline and tools like OpenSSF Scorecard see the release as signed.
      - name: Provenance asset
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/kynex.intoto.jsonl
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.2.0-beta.1) is published as a prerelease.
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $flags
