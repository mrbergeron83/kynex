# Build Kynex for every desktop OS and publish a GitHub Release.
#
# Push a tag matching the version in Cargo.toml to release:
#   git tag v0.1.0 && git push origin v0.1.0
# Running it by hand (workflow_dispatch) only builds, so the archives can be
# checked from the run's artifacts without publishing anything.
#
# Assets are plain archives named kynex-<target>.<zip|tar.gz> plus SHA256SUMS;
# keep those names stable, an installer or updater will look them up. Each
# archive gets a signed build provenance attestation; check one with
#   gh attestation verify kynex-x86_64-pc-windows-msvc.zip --repo mrbergeron83/kynex
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # The oldest supported Ubuntu runner, so the binary runs on older glibc too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No cache for release builds: a poisoned cache must not end up in a published binary.
      - name: Linux libraries for gpui
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about
      # Fails if a dependency's license isn't accepted in about.toml.
      - name: Third-party licenses
        run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
      - name: Package
        run: |
          mkdir dist pkg
          dir=target/${{ matrix.target }}/release
          name=kynex-${{ matrix.target }}
          cp LICENSE.md NOTICE.md THIRD-PARTY-LICENSES.txt pkg/
          mkdir pkg/fonts
          cp assets/fonts/*-LICENSE.txt pkg/fonts/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$dir/kynex.exe" pkg/
            (cd pkg && 7z a "../dist/$name.zip" .)
          else
            cp "$dir/kynex" pkg/
            tar -czf "dist/$name.tar.gz" -C pkg .
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kynex-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.2.0-beta.1) is published as a prerelease.
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $flags
