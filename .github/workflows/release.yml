# Build Kynex for every desktop OS and publish a GitHub Release.
#
# Merging a release PR releases: when a push to main brings a Cargo.toml
# version that isn't released yet, this builds that commit and publishes
# vX.Y.Z, pushing the tag on it (with a deploy key, the release environment's
# RELEASE_TAG_KEY) only once everything has passed. Pushing a tag by hand still
# works (it must match Cargo.toml and be on main). Running it by hand
# (workflow_dispatch) only builds, so the archives can be checked from the run's
# artifacts without publishing anything.
#
# Nothing is built for release until the gates pass: the version is new,
# CI (fmt, clippy, tests on every OS) passes on the commit, and cargo-deny
# finds no advisories as of now, not as of the merge.
#
# Once it's set up, kynex.exe is Authenticode-signed before the checksums are taken
# (the sign-windows job; CONTRIBUTING.md has the setup).
#
# Assets are plain archives named kynex-<target>.<zip|tar.gz> plus SHA256SUMS;
# keep those names stable, an installer or updater will look them up. Each
# archive gets a signed build provenance attestation, also published as
# kynex.intoto.jsonl; check one with
#   gh attestation verify kynex-x86_64-pc-windows-msvc.zip --repo mrbergeron83/kynex
name: Release

on:
  push:
    # A release PR changes the version in Cargo.toml; a fix to this workflow retries an
    # unreleased version (tag pushes ignore `paths`).
    branches: [main]
    paths: [Cargo.toml, .github/workflows/release.yml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time per ref; a second push waits rather than racing it. Not named after
# the workflow: CI, which this calls, uses that name for its group, and a shared group deadlocks.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # In the message of tags this workflow pushes, so the run their push starts stands aside.
  TAG_MARK: Tagged by the Release workflow

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      # The tag to publish, or empty when there's nothing to release.
      tag: ${{ steps.version.outputs.tag }}
      # Whether the release job creates and pushes the tag (a release from main).
      push_tag: ${{ steps.version.outputs.push_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Version to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          released() { gh api "repos/$GITHUB_REPOSITORY/releases/tags/$1" --silent 2>/dev/null; }
          case "$GITHUB_REF" in
            refs/tags/*)
              if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
                exit 1
              fi
              # The tag this workflow pushes from main starts a run too; that release is
              # already under way there.
              object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')
              message=""
              if [ -n "$object" ]; then
                message=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq .message)
              fi
              if printf '%s' "$message" | grep -qF "$TAG_MARK"; then
                echo "$GITHUB_REF_NAME was tagged by a release from main; nothing to do here"
              elif released "$GITHUB_REF_NAME"; then
                echo "$GITHUB_REF_NAME is already released"
              else
                echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
              fi
              ;;
            refs/heads/main)
              tag="v$version"
              # On failure gh prints the error body, so only a success counts as tagged.
              tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null) || tagged=""
              if [ -z "$tagged" ]; then
                echo "Releasing $tag from $GITHUB_SHA"
                echo "tag=$tag" >> "$GITHUB_OUTPUT"
                echo "push_tag=true" >> "$GITHUB_OUTPUT"
              elif released "$tag"; then
                # Cargo.toml changed without a new version (a dependency, say).
                echo "$tag is already released; nothing to do"
              elif [ "$tagged" = "$GITHUB_SHA" ]; then
                # Tagged by an earlier run that failed before publishing: finish it.
                echo "Publishing $tag, already tagged on $GITHUB_SHA"
                echo "tag=$tag" >> "$GITHUB_OUTPUT"
              else
                echo "::error::$tag is tagged on $tagged, not $GITHUB_SHA, and isn't released; delete the tag or bump the version"
                exit 1
              fi
              ;;
          esac
      # Only reviewed, merged code is released: main takes changes through pull requests.
      - name: Tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) isn't on main; release from a merged commit"
            exit 1
          fi
      # Release tags should be signed (shown as Verified on GitHub); a warning for now.
      - name: Tag is signed
        if: startsWith(github.ref, 'refs/tags/') && steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq 'select(.object.type == "tag") | .object.sha')
          verified=false
          if [ -n "$tag" ]; then
            verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag" --jq .verification.verified)
          fi
          if [ "$verified" != true ]; then
            echo "::warning::$GITHUB_REF_NAME isn't a signed tag; see Releasing in CONTRIBUTING.md"
          fi

  checks:
    needs: verify
    # Something to release, or a build-only run by hand.
    if: needs.verify.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    # `$/` is this repository at the commit being released, with no checkout involved.
    uses: $/.github/workflows/ci.yml

  cargo-deny:
    needs: verify
    # Something to release, or a build-only run by hand.
    if: needs.verify.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  build:
    needs: [verify, checks, cargo-deny]
    if: needs.verify.outputs.tag != '' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # The oldest supported Ubuntu runner, so the binary runs on older glibc too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No cache for release builds: a poisoned cache must not end up in a published binary.
      - name: Linux libraries for gpui
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev libasound2-dev
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about
      # Fails if a dependency's license isn't accepted in packaging/about.toml.
      - name: Third-party licenses
        run: cargo about generate -c packaging/about.toml packaging/about.hbs -o THIRD-PARTY-LICENSES.txt
      - name: Package
        run: |
          mkdir dist pkg
          dir=target/${{ matrix.target }}/release
          name=kynex-${{ matrix.target }}
          cp LICENSE NOTICE.md THIRD-PARTY-LICENSES.txt pkg/
          mkdir pkg/fonts
          cp assets/fonts/*-LICENSE.txt pkg/fonts/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$dir/kynex.exe" pkg/
            (cd pkg && 7z a "../dist/$name.zip" .)
          else
            cp "$dir/kynex" pkg/
            tar -czf "dist/$name.tar.gz" -C pkg .
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kynex-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Authenticode-signs kynex.exe with Azure Artifact Signing, so SmartScreen knows
  # the publisher. Off until the repository variable SIGN_WINDOWS is "true"; the
  # credentials live in the protected `release` environment (see CONTRIBUTING.md).
  sign-windows:
    needs: [verify, build]
    if: needs.verify.outputs.tag != '' && vars.SIGN_WINDOWS == 'true'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Azure sign-in with OIDC, no stored password
    env:
      NAME: kynex-x86_64-pc-windows-msvc
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kynex-x86_64-pc-windows-msvc
          path: dist
      - name: Unpack
        shell: pwsh
        run: Expand-Archive "dist/$env:NAME.zip" -DestinationPath pkg
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\pkg\kynex.exe
          # Signs as the Azure CLI login above; the other credential types stay out of it.
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
      - name: Check the signature and repack
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature pkg/kynex.exe
          if ($sig.Status -ne 'Valid') { throw "kynex.exe isn't validly signed: $($sig.Status) $($sig.StatusMessage)" }
          Remove-Item "dist/$env:NAME.zip"
          Compress-Archive -Path pkg/* -DestinationPath "dist/$env:NAME.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kynex-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error
          overwrite: true

  release:
    needs: [verify, build, sign-windows]
    # Signing is skipped while it's off; a failed signing publishes nothing.
    if: ${{ !failure() && !cancelled() && needs.verify.outputs.tag != '' }}
    runs-on: ubuntu-latest
    # Holds RELEASE_TAG_KEY: the private half of a deploy key with write access. Deploy keys
    # are on the "Protect release tags" ruleset's bypass list, which the job's own token
    # can't be; the environment only lets main and v* tags in (CONTRIBUTING.md has the setup).
    environment: release
    permissions:
      contents: write
      id-token: write # attestations
      attestations: write
    steps:
      # Tags the commit just built, only now that everything has passed. A tag that's pushed
      # but never published is picked up by the next run from main.
      - name: Tag
        if: needs.verify.outputs.push_tag == 'true'
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          KEY: ${{ secrets.RELEASE_TAG_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::the release environment has no RELEASE_TAG_KEY secret; see Releasing in CONTRIBUTING.md"
            exit 1
          fi
          key="$RUNNER_TEMP/tag_key"
          printf '%s\n' "$KEY" > "$key"
          chmod 600 "$key"
          git init -q tagger && cd tagger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "git@github.com:$GITHUB_REPOSITORY.git"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          mkdir -p ~/.ssh
          # GitHub's published host keys (https://api.github.com/meta).
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' >> ~/.ssh/known_hosts
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git tag -a "$TAG" -m "Kynex ${TAG#v}" -m "$TAG_MARK from $GITHUB_SHA." "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          rm -f "$key"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-checksums: dist/SHA256SUMS
      # The signed provenance also ships as a release asset, so it can be checked
      # offline and tools like OpenSSF Scorecard see the release as signed.
      - name: Provenance asset
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/kynex.intoto.jsonl
      # The tag exists by now (pushed by hand, or just above), so publishing creates no ref.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          # A tag with a suffix (v0.2.0-beta.1) is published as a prerelease.
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $flags
