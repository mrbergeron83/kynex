# CodeQL static analysis of the Rust code and of these workflows; results go to
# the Security tab (code scanning). Rust is analysed without a build.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docs-only changes pass straight through, and Rust is only analysed when Rust
      # changed; the weekly run always analyses.
      - id: changes
        uses: $/.github/actions/changes
      - id: gate
        env:
          LANGUAGE: ${{ matrix.language }}
          CODE: ${{ steps.changes.outputs.code }}
          RUST: ${{ steps.changes.outputs.rust }}
        run: |
          run=$CODE
          if [ "$LANGUAGE" = rust ]; then
            run=$RUST
            if [ "$CODE" = true ] && [ "$RUST" = false ]; then
              echo "::notice::No Rust changed; skipping the Rust analysis."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "rustc=$(rustc -V | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      # Fetching crates and compiling build scripts is minutes of every cold run.
      # Keyed on the lockfile: a dependency change starts afresh rather than
      # piling stale artifacts into the cache.
      - if: steps.gate.outputs.run == 'true' && matrix.language == 'rust'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/codeql-target
          key: codeql-rust-${{ runner.os }}-${{ steps.gate.outputs.rustc }}-${{ hashFiles('**/Cargo.lock') }}
      - if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        env:
          # Where the Rust extractor compiles build scripts and proc macros, cached above.
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ runner.temp }}/codeql-target
        with:
          category: /language:${{ matrix.language }}
