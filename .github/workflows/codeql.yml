# CodeQL static analysis of the Rust code and of these workflows; results go to
# the Security tab (code scanning). Rust is analysed without a build.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docs-only changes pass straight through; the weekly run always analyses.
      - id: changes
        uses: $/.github/actions/changes
      - if: steps.changes.outputs.code == 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - if: steps.changes.outputs.code == 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
