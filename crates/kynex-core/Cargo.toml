[package]
name = "kynex-core"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false

# Everything Kynex does that isn't drawing: the claude CLI and its stream-json
# protocol, project settings, git, paths. No gpui here, so it builds and tests
# in seconds. dx hot-patches workspace crates too, so edits here apply live.

[dependencies]
alacritty_terminal.workspace = true
base64.workspace = true
dirs.workspace = true
image.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
