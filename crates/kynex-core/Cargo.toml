[package]
name = "kynex-core"
version = "0.1.0"
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false

# Everything Kynex does that isn't drawing: the claude CLI and its stream-json
# protocol, project settings, git, paths. No gpui here, so it builds and tests
# in seconds. dx hot-patches workspace crates too, so edits here apply live.

[dependencies]
alacritty_terminal.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
image.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The same as gpui's, for the shell's COM interfaces: the taskbar badge and shortcut app IDs (attention.rs).
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The same as gpui's, for the Dock badge (attention.rs).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
