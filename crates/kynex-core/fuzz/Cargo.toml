# Fuzz targets for kynex-core's parsers (cargo-fuzz, nightly). Its own
# workspace, so the normal build and ./scripts/check.ps1 never see it.
#
#   cargo +nightly fuzz run git_diff            from crates/kynex-core
#   cargo +nightly fuzz list
#
# The Fuzz action runs them on demand with ClusterFuzzLite (.clusterfuzzlite/,
# .github/workflows/fuzz.yml).

[package]
name = "kynex-core-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
kynex-core = { path = ".." }
libfuzzer-sys = "0.4"

[workspace]
members = ["."]

[[bin]]
name = "hook_payload"
path = "fuzz_targets/hook_payload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_summary"
path = "fuzz_targets/session_summary.rs"
