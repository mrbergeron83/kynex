# cargo-deny: checks every dependency in Cargo.lock. Runs in the Security workflow.
#   cargo deny check
# The license list matches about.toml (what the release archives may ship).

[graph]
all-features = true

[advisories]
# RustSec vulnerabilities, unsound and yanked crates fail. Unmaintained crates
# deep in gpui's tree only fail when we depend on them directly.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# Our own crates (publish = false) are under LICENSE.md, not third-party.
[licenses.private]
ignore = true

[bans]
# gpui pulls in several versions of some crates; report, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
